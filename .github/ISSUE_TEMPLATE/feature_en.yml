name: "Feature Request 👑"
description: "Suggest a feature for ReinaManager"
title: "👑[Feature] "
labels:
  - enhancement


body:


  - type: markdown
    attributes:
      value: |
        ## 👑 Feature Request

        Please avoid:
        - vague suggestions
        - features without real use cases
        - fully AI-generated requests without actual requirements


  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What problem are you currently facing?
    validations:
      required: true


  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: |
        How would you like this problem to be solved?
    validations:
      required: true


  - type: textarea
    id: scenario
    attributes:
      label: Use Case
      description: |
        Explain who uses it, when it is used,
        and why existing features are insufficient.
    validations:
      required: true


  - type: textarea
    id: extra
    attributes:
      label: Additional Context


  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:

        - label: |
            <sub>
            I confirm that this issue is not completely generated by AI.
            I have explained my real requirements and usage scenario.
            If maintainers determine that this request is fully AI-generated
            without actual requirements, I accept that it may be closed directly.
            </sub>
          required: true