name: SignPath Test (Windows x64)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: signpath-test-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-sign:
    if: github.ref == 'refs/heads/signpath-test'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    # 独立测试不使用仅允许受保护分支的 TAURI_KEY 环境，配置说明见 docs/signpath.md。
    env:
      RUST_TARGET: x86_64-pc-windows-msvc
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe

    steps:
      - name: Check signing configuration
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          foreach ($name in @('SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_API_TOKEN')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "缺少仓库级配置 $name，请按 docs/signpath.md 配置 Variables 和 Secrets。"
            }
          }
          $organizationId = [guid]::Empty
          if (-not [guid]::TryParse($env:SIGNPATH_ORGANIZATION_ID, [ref]$organizationId)) {
            throw 'SIGNPATH_ORGANIZATION_ID 必须是 SignPath 后台显示的组织 UUID。'
          }

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: signpath-test-x86_64-pc-windows-msvc
          cache-on-failure: true

      - name: 7-Zip cache
        uses: actions/cache@v6
        with:
          path: src-tauri/target/7zip
          key: 7zip-${{ runner.os }}-x86_64-pc-windows-msvc-${{ hashFiles('src-tauri/build.rs') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version
        id: version
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build unsigned application
        env:
          BGM_APP_SECRET: ${{ secrets.BGM_APP_SECRET }}
        # 先验证主程序 Authenticode 签名；不生成安装包或依赖更新私钥的 .sig。
        run: |
          # 使用配置文件，避免 Windows 下 pnpm 转发参数时丢失内联 JSON 的引号。
          $configPath = Join-Path $env:RUNNER_TEMP 'signpath-test.tauri.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -LiteralPath $configPath -Encoding utf8
          pnpm tauri build --ci --target x86_64-pc-windows-msvc --no-bundle --config $configPath -- --locked

      - name: Upload unsigned application
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          # 同一运行的重试保留独立产物，避免与之前的上传冲突。
          name: ReinaManager-${{ steps.version.outputs.version }}-win_x64-attempt-${{ github.run_attempt }}-signpath-unsigned
          path: src-tauri/target/x86_64-pc-windows-msvc/release/ReinaManager.exe
          if-no-files-found: error
          retention-days: 14

      - name: Submit test signing request
        id: sign
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: test-signing
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signpath-output/signed

      - name: Upload signed application
        uses: actions/upload-artifact@v7
        with:
          name: ReinaManager-${{ steps.version.outputs.version }}-win_x64-attempt-${{ github.run_attempt }}-signpath-signed
          path: signpath-output/signed/ReinaManager.exe
          if-no-files-found: error
          retention-days: 14

      - name: Verify signed application
        timeout-minutes: 3
        env:
          SIGNPATH_REQUEST_ID: ${{ steps.sign.outputs.signing-request-id }}
          SIGNPATH_REQUEST_URL: ${{ steps.sign.outputs.signing-request-web-url }}
        run: |
          $executable = 'signpath-output/signed/ReinaManager.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw '签名结果中缺少 ReinaManager.exe，请检查 Artifact Configuration 的 ZIP 结构。'
          }
          Write-Host '开始读取主程序 Authenticode 签名。'
          $signature = Get-AuthenticodeSignature -LiteralPath $executable
          Write-Host "原始签名状态：$($signature.Status)，$($signature.StatusMessage)"
          if ($null -eq $signature.SignerCertificate -or $signature.SignatureType -ne 'Authenticode') {
            throw 'SignPath 返回的主程序没有 Authenticode 签名。'
          }
          $initialStatus = $signature.Status.ToString()
          $validatedSignature = $signature
          $temporaryTrustAdded = $false
          $verificationError = $null
          # 当前用户根证书存储可能弹出原生确认窗口；托管 runner 有管理员权限，使用机器存储进行临时验证。
          $certificateStore = 'Cert:\LocalMachine\Root'
          $certificateStorePath = "$certificateStore\$($signature.SignerCertificate.Thumbprint)"
          try {
            if ($initialStatus -ne 'Valid') {
              # Windows 也会将未受信任的自签名根返回为 UnknownError；不直接把该状态判为成功。
              if ($initialStatus -notin @('NotTrusted', 'UnknownError')) {
                throw "签名检查失败：$initialStatus，$($signature.StatusMessage)"
              }
              if ($signature.SignerCertificate.Subject -ne $signature.SignerCertificate.Issuer) {
                throw '测试证书不是自签名证书，无法自动进行临时根信任验证。'
              }
              if (-not (Test-Path -LiteralPath $certificateStorePath)) {
                $certificatePath = Join-Path $env:RUNNER_TEMP 'signpath-test-public.cer'
                Write-Host "导出测试证书公钥：$($signature.SignerCertificate.Thumbprint)"
                Export-Certificate -Cert $signature.SignerCertificate -FilePath $certificatePath -Type CERT | Out-Null
                Write-Host "临时导入测试证书公钥到 $certificateStore。"
                Import-Certificate -FilePath $certificatePath -CertStoreLocation $certificateStore -ErrorAction Stop | Out-Null
                $temporaryTrustAdded = $true
                Write-Host '测试证书公钥已导入。'
              }
              Write-Host '重新验证主程序 Authenticode 签名。'
              $validatedSignature = Get-AuthenticodeSignature -LiteralPath $executable
              Write-Host "重新验证结果：$($validatedSignature.Status)，$($validatedSignature.StatusMessage)"
            }
            if ($validatedSignature.Status.ToString() -ne 'Valid') {
              throw "临时信任测试证书后的签名检查失败：$($validatedSignature.Status)，$($validatedSignature.StatusMessage)"
            }
          } catch {
            $verificationError = $_.Exception.Message
          } finally {
            # 仅移除本步骤添加的根证书，保留 runner 原有的信任配置。
            if ($temporaryTrustAdded) {
              Write-Host '移除本步骤添加的测试根证书。'
              Remove-Item -LiteralPath $certificateStorePath -ErrorAction Stop
              Write-Host '测试根证书已移除。'
            }
          }
          if ($temporaryTrustAdded) {
            Write-Warning '已临时信任自签名测试证书并重新验证，临时根证书已移除；这不代表用户系统信任此证书。'
          }
          $report = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            branch = $env:GITHUB_REF_NAME
            signingPolicy = 'test-signing'
            signingRequestId = $env:SIGNPATH_REQUEST_ID
            signingRequestUrl = $env:SIGNPATH_REQUEST_URL
            signatureStatus = $initialStatus
            signatureValidationStatus = $validatedSignature.Status.ToString()
            temporaryTestCertificateTrust = $temporaryTrustAdded
            testCertificateTrustStore = $certificateStore
            verificationError = $verificationError
            certificateSubject = $signature.SignerCertificate.Subject
            certificateThumbprint = $signature.SignerCertificate.Thumbprint
            timestampSubject = $signature.TimeStamperCertificate.Subject
            unsignedSha256 = (Get-FileHash -LiteralPath "src-tauri/target/$env:RUST_TARGET/release/ReinaManager.exe" -Algorithm SHA256).Hash
            signedSha256 = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash
          }
          $report | ConvertTo-Json | Set-Content -LiteralPath signpath-output/signature-report.json -Encoding utf8
          @"
          ## SignPath 测试签名

          - 分支：$env:GITHUB_REF_NAME
          - 提交：$env:GITHUB_SHA
          - 策略：test-signing
          - 签名请求：[$env:SIGNPATH_REQUEST_ID]($env:SIGNPATH_REQUEST_URL)
          - 原始签名状态：$initialStatus
          - 签名验证状态：$($validatedSignature.Status)
          - 是否使用临时测试证书信任：$temporaryTrustAdded
          - 证书：$($signature.SignerCertificate.Subject)
          - 证书指纹：$($signature.SignerCertificate.Thumbprint)
          - 本次验证主程序签名和证书状态；启动行为需下载便携包后检查。
          "@ >> $env:GITHUB_STEP_SUMMARY
          if ($verificationError) {
            throw $verificationError
          }
          Write-Host '签名验证完成，报告已保存。'

      - name: Prepare signed portable application
        run: |
          $portableRoot = 'signpath-output/portable'
          $sevenZip = 'src-tauri/target/7zip'
          foreach ($relativePath in @('7z.exe', '7z.dll', 'Codecs/zstd.dll', 'Codecs/LICENSE', 'License.txt', 'NOTICE.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $sevenZip $relativePath) -PathType Leaf)) {
              throw "便携包缺少内置 7-Zip 文件：$relativePath"
            }
          }
          New-Item -ItemType Directory -Path "$portableRoot/tools" -Force | Out-Null
          New-Item -ItemType Directory -Path "$portableRoot/resources/data" -Force | Out-Null
          Copy-Item -LiteralPath $sevenZip -Destination "$portableRoot/tools/7zip" -Recurse
          Copy-Item -LiteralPath signpath-output/signed/ReinaManager.exe -Destination "$portableRoot/ReinaManager.exe"
          Copy-Item -LiteralPath signpath-output/signature-report.json -Destination "$portableRoot/signature-report.json"
          '该目录启用便携模式，数据库保存在本包内。此应用仅用于 SignPath 测试签名验证。' |
            Set-Content -LiteralPath "$portableRoot/resources/data/readme.txt" -Encoding utf8

      - name: Upload signed portable application
        uses: actions/upload-artifact@v7
        with:
          name: ReinaManager-${{ steps.version.outputs.version }}-win_x64-attempt-${{ github.run_attempt }}-signpath-test-portable
          path: signpath-output/portable
          if-no-files-found: error
          retention-days: 14

      - name: Upload signature report
        if: always() && steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: signpath-test-signature-report-attempt-${{ github.run_attempt }}
          path: signpath-output/signature-report.json
          if-no-files-found: warn
          retention-days: 14
